<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
</head>
<body>
    <h1>Đăng ký tài khoản</h1>
    <form action="#" method="POST">
        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <p>
                <label for="fullname">Họ và tên:</label><br>
                <input type="text" id="fullname" name="fullname" required minlength="2" maxlength="50" placeholder="Nhập họ tên của bạn">
            </p>
            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required placeholder="you@email.com">
            </p>
            <p>
                <label for="phone">Số điện thoại:</label><br>
                <input type="tel" id="phone" name="phone" placeholder="0901234567" pattern="[0-9]{10}">
            </p>
            <p>
                <label for="birthday">Ngày sinh:</label><br>
                <input type="date" id="birthday" name="birthday" max="2026-05-06">
            </p>
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>
            <p>
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" placeholder="user_name01" pattern="[A-Za-z0-9_]{3,20}" required>
            </p>
            <p>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" placeholder="Ít nhất 8 ký tự" minlength="8" pattern="(?=.*[A-Z])(?=.*\d).{8,}" title="Ít nhất 8 ký tự, gồm 1 chữ hoa và 1 số" required>
            </p>
            <p>
                <label for="confirm_password">Xác nhận password:</label><br>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Nhập lại password" minlength="8" pattern="(?=.*[A-Z])(?=.*\d).{8,}" title="Phải giống password và đủ điều kiện" required>
            </p>
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <p>
                <label for="city">Thành phố:</label><br>
                <select id="city" name="city" required>
                    <option value="">Chọn thành phố</option>
                    <option value="hn">Hà Nội</option>
                    <option value="hcm">TP.HCM</option>
                    <option value="dn">Đà Nẵng</option>
                    <option value="hp">Hải Phòng</option>
                    <option value="ct">Thanh Hóa</option>
                </select>
            </p>
            <p>
                <label for="district">Quận/Huyện:</label><br>
                <select id="district" name="district" required>
                    <option value="">Chọn quận/huyện</option>
                    <option value="q1">Quận 1</option>
                    <option value="q7">Quận 7</option>
                    <option value="tb">Quận 2</option>
                    <option value="hp">Quận 11</option>
                </select>
            </p>
            <p>
                <label for="address">Địa chỉ chi tiết:</label><br>
                <textarea id="address" name="address" rows="3" placeholder="Số nhà, đường, phường" required></textarea>
            </p>
            <p>
                Giới tính:<br>
                <label><input type="radio" name="gender" value="male" required> Nam</label><br>
                <label><input type="radio" name="gender" value="female"> Nữ</label><br>
                <label><input type="radio" name="gender" value="other"> Khác</label>
            </p>
        </fieldset>

        <p>
            <label><input type="checkbox" name="agree" required> Tôi đồng ý điều khoản</label>
        </p>
        <p>
            <button type="submit">Đăng ký</button>
            <button type="reset">Làm lại</button>
        </p>
    </form>
</body>
</html>
