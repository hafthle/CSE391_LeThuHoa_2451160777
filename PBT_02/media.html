<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Multimedia sản phẩm</title>
</head>
<body>
    <h1>Giới thiệu sản phẩm</h1>
    <section>
        <h2>Ảnh sản phẩm</h2>
        <figure>
            <img src="https://dummyimage.com/600x400/000/fff&text=%C4%90i%E1%BB%87n+tho%E1%BA%A1i+%C4%91en" alt="Điện thoại thông minh màu đen" loading="lazy" style="max-width:100%; height:auto;">
            <figcaption>Điện thoại thông minh mẫu mới, màu đen.</figcaption>
        </figure>
        <figure>
            <img src="https://dummyimage.com/600x400/fff/000&text=%C4%90i%E1%BB%87n+tho%E1%BA%A1i+tr%E1%BA%AFng" alt="Điện thoại màn hình lớn màu trắng" loading="lazy" style="max-width:100%; height:auto;">
            <figcaption>Màn hình lớn, camera chất lượng cao.</figcaption>
        </figure>
        <figure>
            <img src="https://dummyimage.com/600x400/007acc/fff&text=%C4%90i%E1%BB%87n+tho%E1%BA%A1i+xanh" alt="Điện thoại màu xanh dương" loading="lazy" style="max-width:100%; height:auto;">
            <figcaption>Thiết kế thời trang, pin dùng lâu.</figcaption>
        </figure>
    </section>

    <section>
        <h2>Video giới thiệu</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/ysz5S6PUM-U" title="Video học tiếng Anh ngắn" frameborder="0" allowfullscreen></iframe>
    </section>

    <section>
        <h2>Video nội bộ</h2>
        <video controls poster="https://via.placeholder.com/640x360?text=Poster+Video" style="max-width:100%; height:auto;">
            <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ thẻ video.
        </video>
    </section>

    <section>
        <h2>Audio giới thiệu</h2>
        <audio controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ thẻ audio.
        </audio>
    </section>

    <section>
        <h2>SVG logo đơn giản</h2>
        <svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Logo cửa hàng điện thoại">
            <circle cx="60" cy="60" r="50" fill="#007acc" />
            <rect x="40" y="30" width="40" height="60" fill="#ffffff" rx="8" />
            <circle cx="60" cy="45" r="6" fill="#007acc" />
        </svg>
    </section>
</body>
</html>
