<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Validation Test</title>
</head>
<body>
    <h1>Validation Test</h1>
    <form action="#" method="POST">
        <p>
            <label for="case1">Trường hợp 1 (required):</label><br>
            <input type="text" id="case1" name="case1" required value="">
        </p>
        <p>
            <label for="case2">Trường hợp 2 (email):</label><br>
            <input type="email" id="case2" name="case2" value="abc">
        </p>
        <p>
            <label for="case3">Trường hợp 3 (number 1-10):</label><br>
            <input type="number" id="case3" name="case3" min="1" max="10" value="15">
        </p>
        <p>
            <label for="case4">Trường hợp 4 (pattern 10 chữ số):</label><br>
            <input type="text" id="case4" name="case4" pattern="[0-9]{10}" value="abc123">
        </p>
        <p>
            <label for="case5">Trường hợp 5 (password minlength 8):</label><br>
            <input type="password" id="case5" name="case5" minlength="8" value="123">
        </p>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
