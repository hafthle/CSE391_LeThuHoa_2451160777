<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Checkout đặt hàng</title>
</head>
<body>
    <h1>Đặt hàng</h1>

    <section>
        <h2>1.Giỏ hàng</h2>
        <table border="1" cellpadding="6" cellspacing="0">
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Điện thoại A</td>
                    <td>8.000.000đ</td>
                    <td>1</td>
                    <td>8.000.000đ</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Tai nghe không dây</td>
                    <td>1.500.000đ</td>
                    <td>1</td>
                    <td>1.500.000đ</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Ốp lưng bảo vệ</td>
                    <td>200.000đ</td>
                    <td>2</td>
                    <td>400.000đ</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="4"><strong>Tổng cộng</strong></td>
                    <td><strong>9.900.000đ</strong></td>
                </tr>
            </tfoot>
        </table>
    </section>

    <form action="#" method="POST">
        <section>
            <h2>2.Thanh toán</h2>
            <p>
                <label><input type="radio" name="payment" value="cod" required> COD</label><br>
                <label><input type="radio" name="payment" value="bank"> Chuyển khoản</label><br>
                <label><input type="radio" name="payment" value="wallet"> Ví điện tử</label>
            </p>
            <p>
                <label for="promo">Mã giảm giá:</label><br>
                <input type="text" id="promo" name="promo" placeholder="SALE2026" pattern="SALE[0-9]{4}">
            </p>
            <p>
                <label for="note">Ghi chú (không bắt buộc):</label><br>
                <textarea id="note" name="note" rows="3" placeholder="Ghi chú cho người giao hàng"></textarea>
            </p>
        </section>

        <section>
            <h2>3.Thông tin giao hàng</h2>
            <p>
                <label for="search_product">Tìm sản phẩm:</label><br>
                <input type="search" id="search_product" name="search_product" list="products" placeholder="Nhập tên sản phẩm">
                <datalist id="products">
                    <option value="Điện thoại A">
                    <option value="Tai nghe không dây">
                    <option value="Ốp lưng bảo vệ">
                </datalist>
            </p>
            <p>
                <label for="delivery_date">Ngày giao hàng mong muốn:</label><br>
                <input type="date" id="delivery_date" name="delivery_date" min="2026-05-07" required>
            </p>
            <p>
                <label for="delivery_time">Khung giờ:</label><br>
                <select id="delivery_time" name="delivery_time" required>
                    <option value="">Chọn khung giờ</option>
                    <option value="morning">Sáng 8-12h</option>
                    <option value="afternoon">Chiều 14-18h</option>
                    <option value="evening">Tối 18-21h</option>
                </select>
            </p>
            <p>
                <label for="shipping_days">Thời gian giao hàng (số ngày):</label><br>
                <input type="range" id="shipping_days" name="shipping_days" min="1" max="7" step="1" value="3">
            </p>
            <p>
                <label for="order_total">Tổng tiền tĩnh:</label><br>
                <output id="order_total" name="order_total">9.900.000đ</output>
            </p>
            <p>
                <label for="loyalty">Điểm tích lũy:</label><br>
                <meter id="loyalty" min="0" max="100" value="55">55/100</meter>
            </p>
        </section>

        <p>
            <button type="submit" aria-label="Xác nhận đặt hàng">Xác nhận đặt hàng</button>
        </p>
    </form>
</body>
</html>
