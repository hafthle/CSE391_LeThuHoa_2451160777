<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Number</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            font-family: 'Courier New', monospace;
            color: #e2e8f0;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 36px 32px;
            width: 360px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .sub {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 28px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        input[type=number] {
            flex: 1;
            padding: 10px 14px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }

        input[type=number]:focus {
            border-color: #38bdf8;
        }

        input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: opacity .15s;
        }

        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.35; cursor: not-allowed; }

        #btnGuess {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
        }

        #btnReset {
            width: 100%;
            background: #334155;
            color: #94a3b8;
            margin-top: 12px;
        }

        .msg {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            display: none;
            margin-bottom: 10px;
        }

        .msg.hint  { background: #1e3a5f; color: #7dd3fc; }
        .msg.win   { background: #14532d; color: #86efac; }
        .msg.lose  { background: #7f1d1d; color: #fca5a5; }
        .msg.warn  { background: #451a03; color: #fcd34d; }

        #counter {
            font-size: 12px;
            color: #475569;
            text-align: right;
            margin-bottom: 4px;
        }

        #history {
            font-size: 12px;
            color: #475569;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">Đoán số</div>
        <div class="sub">Chọn số từ 1–100 · Tối đa 7 lần</div>

        <div class="input-row">
            <input type="number" id="inp" placeholder="Nhập số..." min="1" max="100">
            <button id="btnGuess">Đoán</button>
        </div>

        <div class="msg" id="msg"></div>
        <div id="counter"></div>
        <div id="history"></div>

        <button id="btnReset">↺ Chơi lại</button>
    </div>

    <script src="guess.js"></script>
</body>
</html>
